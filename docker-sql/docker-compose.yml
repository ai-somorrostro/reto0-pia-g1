services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: criptos_sqlserver_db
    restart: always
    env_file:
      - .env
    ports:
      - "1433:1433"
    volumes:
      - ./sql_data:/var/opt/mssql  # persistencia de datos

  criptos:
    build: .
    container_name: criptos_app
    restart: always
    depends_on:
      - sqlserver
    env_file:
      - .env
    volumes:
      - ./app:/app
