services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: criptos_sqlserver_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=TuPasswordSegura123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - ./sql_data:/var/opt/mssql  # persistencia de datos

  criptos:
    build: .
    container_name: criptos_app
    restart: always
    depends_on:
      - sqlserver
    environment:
      - DB_SERVER=sqlserver
      - DB_NAME=criptosdb
      - DB_USER=sa
      - DB_PASSWORD=TuPasswordSegura123
    volumes:
      - ./app:/app
